; ================================================================
;  Liquid Glass Theme Toggle
;  One click switches Windows between Light and Dark mode.
;  Knob LEFT  (sun)  = Light mode
;  Knob RIGHT (moon) = Dark mode
;  Hover = the knob morphs into the liquid-glass lens.
;  Click to toggle, or drag the knob and let go (snaps to nearest side).
; ================================================================

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
MouseOverAction=[!SetVariable HT 1][!CommandMeasure mHover "Stop 1"][!CommandMeasure mHover "Execute 1"]
; leaving the skin mid-drag counts as a release (UpX far away = drag, not click)
MouseLeaveAction=[!SetVariable HT 0][!CommandMeasure mHover "Stop 1"][!CommandMeasure mHover "Execute 1"][!SetVariable UpX 99999][!UpdateMeasure mRelease]

[Metadata]
Name=Liquid Glass Theme Toggle
Author=Godwin Ganayo
Information=Apple "Liquid Glass" style switch that toggles Windows Light / Dark mode. Edit S in [Variables] to resize.
Version=1.1
License=MIT

[Variables]
; ---- user settings ---------------------------------------------
; Overall scale (1 = 232 x 130 px). Refresh the skin after changing.
S=0.3333
FontFace=Segoe UI Variable Display
; ---- animation state (do not edit) -----------------------------
; P = knob position (0 = light/left, 1 = dark/right), V = velocity, To = spring target
; Cur = committed theme (0 = light, 1 = dark)
P=0
V=0
To=0
Cur=0
; drag state (cursor X in skin pixels)
Drag=0
DownX=0
DownP=0
DragX=0
UpX=0
; Hv = hover morph (0 = plain knob, 1 = glass lens), Hvv = velocity, HT = target
Hv=0
Hvv=0
HT=0
Loaded=0
; shorthand for animated geometry (resolved through DynamicVariables)
KX=[mKX:2]
KW=[mKW:2]
KH=[mKH:2]
Matrix=#S#;0;0;#S#;0;0

; ================================================================
;  Theme detection (also keeps the switch in sync when the theme is
;  changed from Windows Settings or another tool)
; ================================================================

[mReg]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\CurrentVersion\Themes\Personalize
RegValue=AppsUseLightTheme
IfCondition=mReg=1
IfTrueAction=[!SetVariable Cur 0][!SetVariable To 0][!SetVariable P "(#Loaded#=1 ? #P# : 0)"][!SetVariable Loaded 1][!CommandMeasure mAnim "Stop 1"][!CommandMeasure mAnim "Execute 1"]
IfFalseAction=[!SetVariable Cur 1][!SetVariable To 1][!SetVariable P "(#Loaded#=1 ? #P# : 1)"][!SetVariable Loaded 1][!CommandMeasure mAnim "Stop 1"][!CommandMeasure mAnim "Execute 1"]
DynamicVariables=1

; mRun0 -> Dark mode, mRun1 -> Light mode (index = the *old* committed theme)
[mRun0]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#SetTheme.ps1" -Light 0
State=Hide

[mRun1]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File "#@#SetTheme.ps1" -Light 1
State=Hide

; ================================================================
;  Click / drag logic. These Calc measures only update when a mouse
;  action calls !UpdateMeasure on them; IfConditionMode=1 makes their
;  actions fire on every such update.
; ================================================================

[mDown]
Measure=Calc
Formula=0
UpdateDivider=-1
DynamicVariables=1
IfCondition=#Drag#=1
IfTrueAction=[!SetVariable DownP #P#]
IfConditionMode=1

[mDragMove]
; spring target follows the cursor (slight rubber-band past the ends)
Measure=Calc
Formula=0
UpdateDivider=-1
DynamicVariables=1
IfCondition=#Drag#=1
IfTrueAction=[!SetVariable To "(Clamp(#DownP#+(#DragX#-#DownX#)/112,-0.06,1.06))"][!CommandMeasure mAnim "Stop 1"][!CommandMeasure mAnim "Execute 1"]
IfConditionMode=1

[mRelease]
; 0 = not dragging, 1 = switch theme, 2 = spring back to the current side.
; Barely moved = click (always switch); otherwise the nearer side wins, with flick momentum.
Measure=Calc
Formula=(#Drag#=1) ? ((Abs(#UpX#-#DownX#)<3) ? 1 : ((((#To#+#V#*4)>0.5 ? 1 : 0)<>#Cur#) ? 1 : 2)) : 0
UpdateDivider=-1
DynamicVariables=1
IfCondition=mRelease=1
IfTrueAction=[!SetVariable Drag 0][!CommandMeasure mRun#Cur# "Run"][!SetVariable To "(1-#Cur#)"][!SetVariable Cur "(1-#Cur#)"][!CommandMeasure mAnim "Stop 1"][!CommandMeasure mAnim "Execute 1"]
IfCondition2=mRelease=2
IfTrueAction2=[!SetVariable Drag 0][!SetVariable To #Cur#][!CommandMeasure mAnim "Stop 1"][!CommandMeasure mAnim "Execute 1"]
IfConditionMode=1

; ================================================================
;  Animation: damped springs (~60 fps) -> slight overshoot + settle
; ================================================================

[mAnim]
; knob travel
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Step,15,50 | Settle
Step=[!SetVariable P "(#P#+#V#*0.7+(#To#-#P#)*0.07)"][!SetVariable V "(#V#*0.7+(#To#-#P#)*0.07)"][!UpdateMeasure mAnim][!UpdateMeasureGroup Anim][!UpdateMeterGroup Toggle][!Redraw]
Settle=[!SetVariable P #To#][!SetVariable V 0][!UpdateMeasure mAnim][!UpdateMeasureGroup Anim][!UpdateMeterGroup Toggle][!Redraw]
DynamicVariables=1

[mHover]
; knob <-> glass lens morph
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat Step,15,40 | Settle
Step=[!SetVariable Hv "(#Hv#+#Hvv#*0.68+(#HT#-#Hv#)*0.09)"][!SetVariable Hvv "(#Hvv#*0.68+(#HT#-#Hv#)*0.09)"][!UpdateMeasure mHover][!UpdateMeasureGroup Anim][!UpdateMeterGroup Toggle][!Redraw]
Settle=[!SetVariable Hv #HT#][!SetVariable Hvv 0][!UpdateMeasure mHover][!UpdateMeasureGroup Anim][!UpdateMeterGroup Toggle][!Redraw]
DynamicVariables=1

; ---- derived values ---------------------------------------------
[mPc]
Measure=Calc
Formula=Clamp(#P#,0,1)
Group=Anim
DynamicVariables=1

[mHc]
; hover amount for opacities
Measure=Calc
Formula=Clamp(#Hv#,0,1)
Group=Anim
DynamicVariables=1

[mHs]
; hover amount for size (keeps the springy overshoot)
Measure=Calc
Formula=Max(#Hv#,0)
Group=Anim
DynamicVariables=1

[mStr]
; liquid stretch while the knob is moving
Measure=Calc
Formula=Min(Abs(#V#)*2.2,0.3)
Group=Anim
DynamicVariables=1

[mKX]
Measure=Calc
Formula=60+112*#P#
Group=Anim
DynamicVariables=1

[mKW]
Measure=Calc
Formula=(56+28*mHs)*(1+mStr)
Group=Anim

[mKH]
Measure=Calc
Formula=(56+44*mHs)*(1-0.22*mStr)
Group=Anim

[mKRy]
Measure=Calc
Formula=mKH*(0.5-0.08*mHc)
Group=Anim

[mA]
; dark-theme opacity
Measure=Calc
Formula=Round(255*mPc)
Group=Anim

[mIA]
; light-theme opacity
Measure=Calc
Formula=255-mA
Group=Anim

[mGShA]
Measure=Calc
Formula=Round(45+45*mPc)
Group=Anim

[mShA]
Measure=Calc
Formula=Round((45+40*mPc)*(0.7+0.3*mHc))
Group=Anim

[mBodyTopA]
Measure=Calc
Formula=Round((95-65*mPc)*(1-mHc)+(80-56*mPc)*mHc)
Group=Anim

[mBodyMidA]
Measure=Calc
Formula=Round((60-38*mPc)*(1-mHc)+(34-22*mPc)*mHc)
Group=Anim

[mBodyBotA]
Measure=Calc
Formula=Round(mBodyMidA*(0.8-0.3*mHc))
Group=Anim

[mRimA]
Measure=Calc
Formula=Round((200-140*mPc)*(1-mHc)+(235-125*mPc)*mHc)
Group=Anim

[mRimMidA]
Measure=Calc
Formula=Round((110-80*mPc)*(1-mHc)+(60-42*mPc)*mHc)
Group=Anim

[mLensA]
Measure=Calc
Formula=Round((46-34*mPc)*mHc)
Group=Anim

[mSpecA]
Measure=Calc
Formula=Round((165-70*mPc)*mHc)
Group=Anim

[mGlowA]
Measure=Calc
Formula=Round(50+90*mPc)
Group=Anim

[mTrackHiA]
Measure=Calc
Formula=Round(180-140*mPc)
Group=Anim

[mSunS]
Measure=Calc
Formula=1-0.55*mPc
Group=Anim

[mSunR]
Measure=Calc
Formula=mPc*PI/2
Group=Anim

[mMoonS]
Measure=Calc
Formula=0.45+0.55*mPc
Group=Anim

[mMoonR]
Measure=Calc
Formula=(1-mPc)*(-PI/2)
Group=Anim

[mLightX]
Measure=Calc
Formula=146+12*mPc
Group=Anim

[mDarkX]
Measure=Calc
Formula=86-12*(1-mPc)
Group=Anim

[mLightLabelA]
Measure=Calc
Formula=Round(255*Clamp(1-mPc*1.6,0,1))
Group=Anim

[mDarkLabelA]
Measure=Calc
Formula=Round(255*Clamp((mPc-0.375)*1.6,0,1))
Group=Anim

; ================================================================
;  Meters  (designed at 232 x 130, scaled by S)
;  Track: x 28..204, y 28..92 (centre y 60)
; ================================================================

[MeterSize]
; reserves the window size for the scaled skin
Meter=Image
W=(232*#S#)
H=(130*#S#)
SolidColor=0,0,0,0

[MeterBase]
Meter=Shape
Group=Toggle
DynamicVariables=1
TransformationMatrix=#Matrix#
; ground shadow
Shape=Ellipse 116,96,104,20 | Fill RadialGradient GShadow | StrokeWidth 0
GShadow=0,0,0,0,104,20 | 0,0,0,[mGShA:0] ; 0.0 | 0,0,0,0 ; 1.0
; track - light
Shape2=Rectangle 28,28,176,64,32 | Fill LinearGradient GTrackL | StrokeWidth 0
GTrackL=90 | 216,217,222,255 ; 0.0 | 190,191,196,255 ; 1.0
; track - dark (cross-fades over the light one)
Shape3=Rectangle 28,28,176,64,32 | Fill LinearGradient GTrackD | StrokeWidth 0
GTrackD=90 | 46,47,51,[mA:0] ; 0.0 | 30,31,34,[mA:0] ; 1.0
; track bevel: bright top edge, soft dark bottom edge
Shape4=Rectangle 28.5,28.5,175,63,31.5 | Fill Color 0,0,0,0 | Stroke LinearGradient GTrackEdge | StrokeWidth 1
GTrackEdge=90 | 255,255,255,[mTrackHiA:0] ; 0.0 | 255,255,255,0 ; 0.45 | 0,0,0,30 ; 1.0

[MeterLabelLight]
Meter=String
Group=Toggle
DynamicVariables=1
TransformationMatrix=#Matrix#
Text=Light
X=[mLightX:2]
Y=59
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=15
FontWeight=500
FontColor=250,250,252,[mLightLabelA:0]
StringEffect=Shadow
FontEffectColor=0,0,0,([mLightLabelA:0]*0.12)
AntiAlias=1

[MeterLabelDark]
Meter=String
Group=Toggle
DynamicVariables=1
TransformationMatrix=#Matrix#
Text=Dark
X=[mDarkX:2]
Y=59
StringAlign=CenterCenter
FontFace=#FontFace#
FontSize=15
FontWeight=500
FontColor=150,151,157,[mDarkLabelA:0]
AntiAlias=1

[MeterKnob]
Meter=Shape
Group=Toggle
DynamicVariables=1
TransformationMatrix=#Matrix#
; knob drop shadow
Shape=Ellipse #KX#,(78+8*[mHc:3]),(#KW#*0.5),(10+8*[mHc:3]) | Fill RadialGradient GKnobShadow | StrokeWidth 0
GKnobShadow=0,0,0,0,(#KW#*0.5),(10+8*[mHc:3]) | 0,0,0,[mShA:0] ; 0.0 | 0,0,0,0 ; 1.0
; knob body (plain knob -> glass lens on hover)
Shape2=Rectangle (#KX#-#KW#/2),(60-#KH#/2),#KW#,#KH#,(#KW#*0.5),[mKRy:2] | Fill LinearGradient GBody | Stroke LinearGradient GRim | StrokeWidth 1.2
GBody=90 | 255,255,255,[mBodyTopA:0] ; 0.0 | 255,255,255,[mBodyMidA:0] ; 0.45 | 255,255,255,[mBodyBotA:0] ; 0.75 | 255,255,255,[mBodyTopA:0] ; 1.0
GRim=90 | 255,255,255,[mRimA:0] ; 0.0 | 255,255,255,[mRimMidA:0] ; 0.5 | 255,255,255,([mRimA:0]*0.8) ; 1.0
; refracted track "lens" inside the glass (hover only)
Shape3=Rectangle (#KX#-#KW#/2+6),32,(#KW#-12),56,28 | Fill LinearGradient GLens | Stroke Color 255,255,255,([mLensA:0]*1.4) | StrokeWidth 1
GLens=90 | 255,255,255,([mLensA:0]*1.3) ; 0.0 | 255,255,255,([mLensA:0]*0.5) ; 0.6 | 255,255,255,[mLensA:0] ; 1.0
; specular highlights (hover only)
Shape4=Ellipse #KX#,(60-#KH#*0.36),(#KW#*0.3),(#KH#*0.07) | Fill RadialGradient GSpec | StrokeWidth 0
GSpec=0,0,0,0,(#KW#*0.3),(#KH#*0.07) | 255,255,255,[mSpecA:0] ; 0.0 | 255,255,255,0 ; 1.0
Shape5=Ellipse #KX#,(60+#KH#*0.39),(#KW#*0.26),(#KH#*0.05) | Fill RadialGradient GSpec2 | StrokeWidth 0
GSpec2=0,0,0,0,(#KW#*0.26),(#KH#*0.05) | 255,255,255,([mSpecA:0]*0.55) ; 0.0 | 255,255,255,0 ; 1.0
; icon glow
Shape6=Ellipse #KX#,60,22,22 | Fill RadialGradient GGlow | StrokeWidth 0
GGlow=0,0,0,0,22,22 | 255,255,255,[mGlowA:0] ; 0.0 | 255,255,255,([mGlowA:0]*0.25) ; 0.45 | 255,255,255,0 ; 1.0
; sun (rotates + shrinks out)
Shape7=Ellipse #KX#,60,(5.5*[mSunS:3]) | Fill Color 255,255,255,[mIA:0] | StrokeWidth 0
Ray=StrokeWidth 2 | StrokeStartCap Round | StrokeEndCap Round | Stroke Color 255,255,255,[mIA:0]
Shape8=Line (#KX#+Cos([mSunR:4]+0*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+0*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+0*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+0*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape9=Line (#KX#+Cos([mSunR:4]+1*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+1*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+1*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+1*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape10=Line (#KX#+Cos([mSunR:4]+2*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+2*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+2*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+2*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape11=Line (#KX#+Cos([mSunR:4]+3*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+3*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+3*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+3*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape12=Line (#KX#+Cos([mSunR:4]+4*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+4*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+4*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+4*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape13=Line (#KX#+Cos([mSunR:4]+5*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+5*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+5*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+5*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape14=Line (#KX#+Cos([mSunR:4]+6*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+6*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+6*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+6*PI/4)*12.5*[mSunS:3]) | Extend Ray
Shape15=Line (#KX#+Cos([mSunR:4]+7*PI/4)*9*[mSunS:3]),(60+Sin([mSunR:4]+7*PI/4)*9*[mSunS:3]),(#KX#+Cos([mSunR:4]+7*PI/4)*12.5*[mSunS:3]),(60+Sin([mSunR:4]+7*PI/4)*12.5*[mSunS:3]) | Extend Ray
; moon (crescent = disc minus offset disc, rotates + grows in)
Shape16=Ellipse #KX#,60,(9.5*[mMoonS:3]) | Fill Color 255,255,255,[mA:0] | StrokeWidth 0
Shape17=Ellipse (#KX#+Cos([mMoonR:4]-PI/4)*6*[mMoonS:3]),(60+Sin([mMoonR:4]-PI/4)*6*[mMoonS:3]),(8.2*[mMoonS:3])
Shape18=Combine Shape16 | Exclude Shape17

[MeterHit]
; solid (alpha 1) backing so the hover/drag area has no transparent holes
Meter=Image
X=(24*#S#)
Y=(14*#S#)
W=(184*#S#)
H=(92*#S#)
SolidColor=0,0,0,1

[SliceStyle]
; 23 invisible strips; each reports its own centre X (design units) while
; the button is held, giving the knob a cursor position to follow
Y=(14*#S#)
W=(8*#S#+1)
H=(92*#S#)
SolidColor=0,0,0,1
MouseActionCursorName=Hand

[Slice0]
Meter=Image
MeterStyle=SliceStyle
X=(24*#S#)
LeftMouseDownAction=[!SetVariable Drag 1][!SetVariable DownX 28][!SetVariable DragX 28][!UpdateMeasure mDown]
MouseOverAction=[!SetVariable DragX 28][!UpdateMeasure mDragMove]
LeftMouseUpAction=[!SetVariable UpX 28][!UpdateMeasure mRelease]

